<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Backrooms Maze Race Game</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
    #instructions {
      position: absolute;
      top: 10px;
      left: 10px;
      font-family: sans-serif;
      color: #fff;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px;
      border-radius: 5px;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="instructions">
    <h3>Backrooms Maze Race</h3>
    <p>W / ↑ : Move forward (increasing Z)</p>
    <p>S / ↓ : Move backward (decreasing Z)</p>
    <p>A / ← : Move left (decreasing X)</p>
    <p>D / → : Move right (increasing X)</p>
    <p>Hold Shift to sprint!</p>
  </div>

  <!-- Include Three.js -->
  <script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
  <script>
    // Setup scene, camera, and renderer
    const scene = new THREE.Scene();
    // A muted yellowish background evokes the unsettling vibe of the backrooms.
    scene.background = new THREE.Color(0xf0e4b8);

    const camera = new THREE.PerspectiveCamera(
      75, window.innerWidth / window.innerHeight, 0.1, 1000
    );
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lights to softly illuminate the maze
    const ambientLight = new THREE.AmbientLight(0x888888);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(20, 50, 10);
    scene.add(directionalLight);

    // --- Maze Setup ---
    // Maze layout:
    // "1" = wall, "0" = open space.
    // Outer border cells are walls.
    const mazePlan = [
      "1111111111111",
      "1000000000001",
      "1011111111101",
      "1010000000101",
      "1010111100101",
      "1010100100101",
      "1010100100101",
      "1010111100101",
      "1010000000101",
      "1011111111101",
      "1000000000001",
      "1111111111111"
    ];
    const numRows = mazePlan.length;
    const numCols = mazePlan[0].length;
    const cellSize = 10;
    const wallHeight = 4;

    // Create floor covering the maze (with a subtle yellow tint)
    const floorGeometry = new THREE.PlaneGeometry(numCols * cellSize, numRows * cellSize);
    const floorMaterial = new THREE.MeshPhongMaterial({ color: 0xfbeaa3 });
    const floor = new THREE.Mesh(floorGeometry, floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // Arrays to store wall meshes and their bounding boxes for collision detection
    const walls = [];
    const wallBoxes = [];
    // Position walls based on mazePlan. We map the cell indices into world coordinates.
    for (let row = 0; row < numRows; row++) {
      for (let col = 0; col < numCols; col++) {
        if (mazePlan[row][col] === "1") {
          const wallGeo = new THREE.BoxGeometry(cellSize, wallHeight, cellSize);
          // A pale, slightly tired yellow for the walls
          const wallMat = new THREE.MeshPhongMaterial({ color: 0xddddaa });
          const wallMesh = new THREE.Mesh(wallGeo, wallMat);
          // Center each cell: note we offset by cellSize/2 so that the cell’s center is used.
          wallMesh.position.x = (col - numCols / 2) * cellSize + cellSize / 2;
          wallMesh.position.z = (row - numRows / 2) * cellSize + cellSize / 2;
          wallMesh.position.y = wallHeight / 2;
          scene.add(wallMesh);
          walls.push(wallMesh);
          // Precompute each wall’s bounding box (since walls are static)
          const bbox = new THREE.Box3().setFromObject(wallMesh);
          wallBoxes.push(bbox);
        }
      }
    }

    // --- Player Setup ---
    // The player is represented as a blue box.
    const playerSize = 4;
    const playerGeometry = new THREE.BoxGeometry(playerSize, playerSize, playerSize);
    const playerMaterial = new THREE.MeshPhongMaterial({ color: 0x0000ff });
    const player = new THREE.Mesh(playerGeometry, playerMaterial);
    // Place the player in an open cell: here we choose cell (row 1, col 1)
    player.position.x = (1 - numCols / 2) * cellSize + cellSize / 2;
    player.position.z = (1 - numRows / 2) * cellSize + cellSize / 2;
    player.position.y = playerSize / 2;
    scene.add(player);

    // --- Finish Marker ---
    // The finish marker (a red cone) is placed in another open cell.
    // We want it always visible—even when behind walls—so we disable depth testing.
    const markerGeometry = new THREE.ConeGeometry(2, 4, 16);
    const markerMaterial = new THREE.MeshBasicMaterial({
      color: 0xff0000,
      depthTest: false
    });
    const finishMarker = new THREE.Mesh(markerGeometry, markerMaterial);
    // Choose the finish cell (for example, cell (row 10, col 11))
    finishMarker.position.x = (11 - numCols / 2) * cellSize + cellSize / 2;
    finishMarker.position.z = (10 - numRows / 2) * cellSize + cellSize / 2;
    finishMarker.position.y = 4;
    // Ensure the marker renders after other objects.
    finishMarker.renderOrder = 1;
    scene.add(finishMarker);

    // --- Bot Setup ---
    // Create a few bot racers (yellow boxes) that follow a preset route.
    // For the sake of demonstration, we define waypoints that lead from the start to finish.
    // In this layout the bots will:
    //   1. Start at the same cell as the player (cell: [1,1])
    //   2. Travel vertically down the left corridor (cell: [10,1])
    //   3. Then move horizontally toward the finish cell (cell: [10,11])
    const numBots = 3;
    const bots = [];
    // Define waypoints using the same conversion as above.
    const botWaypoints = [
      new THREE.Vector3(
        (1 - numCols / 2) * cellSize + cellSize / 2,
        playerSize / 2,
        (1 - numRows / 2) * cellSize + cellSize / 2
      ),
      new THREE.Vector3(
        (1 - numCols / 2) * cellSize + cellSize / 2,
        playerSize / 2,
        (10 - numRows / 2) * cellSize + cellSize / 2
      ),
      new THREE.Vector3(
        (11 - numCols / 2) * cellSize + cellSize / 2,
        playerSize / 2,
        (10 - numRows / 2) * cellSize + cellSize / 2
      )
    ];
    for (let i = 0; i < numBots; i++) {
      const botMaterial = new THREE.MeshPhongMaterial({ color: 0xffff00 });
      const bot = new THREE.Mesh(playerGeometry, botMaterial);
      // Offset each bot slightly so they aren’t all stacked
      bot.position.copy(botWaypoints[0]);
      bot.position.x += i * 5;
      bot.waypointIndex = 0;
      bots.push(bot);
      scene.add(bot);
    }

    // --- Movement & Collision ---
    const baseSpeed = 0.5;
    const sprintMultiplier = 2;
    let playerSpeed = baseSpeed;
    const keys = {};
    document.addEventListener("keydown", (event) => {
      keys[event.key.toLowerCase()] = true;
      if (event.key === "Shift") {
        playerSpeed = baseSpeed * sprintMultiplier;
      }
    });
    document.addEventListener("keyup", (event) => {
      keys[event.key.toLowerCase()] = false;
      if (event.key === "Shift") {
        playerSpeed = baseSpeed;
      }
    });

    // Simple collision check using axis-aligned bounding boxes.
    // Since the player is a cube of known size, we will compute its bounding box manually.
    function checkCollision(newPos) {
      const halfSize = playerSize / 2;
      const playerBox = new THREE.Box3(
        new THREE.Vector3(newPos.x - halfSize, newPos.y - halfSize, newPos.z - halfSize),
        new THREE.Vector3(newPos.x + halfSize, newPos.y + halfSize, newPos.z + halfSize)
      );
      // Test against all wall bounding boxes
      for (let i = 0; i < wallBoxes.length; i++) {
        if (playerBox.intersectsBox(wallBoxes[i])) {
          return true;
        }
      }
      return false;
    }

    // --- Bot Movement ---
    // Bots follow their predefined waypoints using a simple linear interpolation.
    function moveBots() {
      bots.forEach((bot) => {
        let target = botWaypoints[bot.waypointIndex];
        const direction = new THREE.Vector3().subVectors(target, bot.position);
        if (direction.length() < 0.5) {
          if (bot.waypointIndex < botWaypoints.length - 1) {
            bot.waypointIndex++;
          }
          target = botWaypoints[bot.waypointIndex];
        }
        direction.normalize();
        bot.position.add(direction.multiplyScalar(0.3)); // bot speed
      });
    }

    // --- Camera Follow ---
    // The camera is placed above and behind the player.
    function updateCamera() {
      camera.position.x = player.position.x - 10;
      camera.position.y = player.position.y + 15;
      camera.position.z = player.position.z - 10;
      camera.lookAt(player.position);
    }

    // --- Animation Loop ---
    function animate() {
      requestAnimationFrame(animate);

      // Build the desired movement vector for the player based on key presses.
      let moveX = 0, moveZ = 0;
      if (keys["w"] || keys["arrowup"]) { moveZ += 1; }
      if (keys["s"] || keys["arrowdown"]) { moveZ -= 1; }
      if (keys["a"] || keys["arrowleft"]) { moveX -= 1; }
      if (keys["d"] || keys["arrowright"]) { moveX += 1; }
      const moveVector = new THREE.Vector3(moveX, 0, moveZ);
      if (moveVector.length() > 0) {
        moveVector.normalize().multiplyScalar(playerSpeed);
        const candidatePos = player.position.clone().add(moveVector);
        // Only update the player position if no collision is detected.
        if (!checkCollision(candidatePos)) {
          player.position.copy(candidatePos);
        }
      }

      // Move the bot racers along their path.
      moveBots();

      // Add a little rotation to the finish marker for flair.
      finishMarker.rotation.y += 0.05;

      // Update the camera to follow the player.
      updateCamera();

      renderer.render(scene, camera);
    }
    animate();

    // Adjust camera on window resize.
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
